<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-icue-framework-version" content="1.0.1">
    <title>tr('XE Weather Clock')</title>
    <link rel="icon" type="image/svg+xml" href="resources/icon.svg">
    <meta name="x-icue-restrictions" data-restrictions='[{"device":"dashboard_lcd"}]'>

    <!-- Only combobox / slider / switch / color / textfield: iCUE's tab-buttons editor
         has been implicated in crashes. No ampersands anywhere in this section. -->

    <!-- Clock -->
    <meta name="x-icue-property" content="timeFormat" data-label="tr('Time Format')" data-type="combobox"
        data-values="[{'key':'12h','value':tr('12 hour')},{'key':'24h','value':tr('24 hour')}]"
        data-default="iCUE.default24HourFormat()">
    <meta name="x-icue-property" content="showSeconds" data-label="tr('Seconds')" data-type="switch" data-default="true">
    <meta name="x-icue-property" content="timeZone" data-label="tr('Time Zone')" data-type="combobox"
        data-values="iCUE.allTimeZones()" data-default="iCUE.defaultTimeZone()">
    <meta name="x-icue-property" content="dateFormat" data-label="tr('Date')" data-type="combobox"
        data-values="[{'key':'MonDDYYYY','value':tr('Nov 15, 2026')},{'key':'DayMonDD','value':tr('Sun, Nov 15')},{'key':'Long','value':tr('Sunday, November 15')},{'key':'MMDDYYYY','value':'11/15/2026'},{'key':'DDMMYYYY','value':'15/11/2026'},{'key':'None','value':tr('None')}]"
        data-default="'MonDDYYYY'">
    <meta name="x-icue-property" content="clockFont" data-label="tr('Clock Font')" data-type="combobox"
        data-values="[{'key':'jost','value':'Jost'},{'key':'outfit','value':'Outfit'},{'key':'quicksand','value':'Quicksand'},{'key':'grotesk','value':'Space Grotesk'},{'key':'bebas','value':'Bebas Neue'},{'key':'orbitron','value':'Orbitron'},{'key':'righteous','value':'Righteous'},{'key':'playfair','value':'Playfair Display'},{'key':'mono','value':'JetBrains Mono'}]"
        data-default="'jost'">

    <!-- Weather -->
    <meta name="x-icue-property" content="city" data-label="tr('City (blank for automatic)')" data-type="textfield" data-default="''">
    <meta name="x-icue-property" content="units" data-label="tr('Units')" data-type="combobox"
        data-values="[{'key':'auto','value':tr('Automatic')},{'key':'F','value':tr('Fahrenheit')},{'key':'C','value':tr('Celsius')}]"
        data-default="'auto'">
    <meta name="x-icue-property" content="showHourly" data-label="tr('Hourly Forecast')" data-type="switch" data-default="true">
    <meta name="x-icue-property" content="animations" data-label="tr('Weather Animations')" data-type="switch" data-default="true">
    <meta name="x-icue-property" content="demoMode" data-label="tr('Demo (cycle through weather and times)')" data-type="combobox"
        data-values="[{'key':'off','value':tr('Off')},{'key':'fast','value':tr('Cycle (fast)')},{'key':'slow','value':tr('Cycle (slow)')}]"
        data-default="'off'">

    <!-- Look -->
    <meta name="x-icue-property" content="background" data-label="tr('Background')" data-type="combobox"
        data-values="[{'key':'scene','value':tr('Live Weather Sky')},{'key':'transparent','value':tr('Transparent')},{'key':'solid','value':tr('Solid Color')}]"
        data-default="'scene'">
    <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#0B0F1A'">
    <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#F4F6FA'">
    <meta name="x-icue-property" content="textScale" data-label="tr('Text Size')" data-type="slider"
        data-default="100" data-min="70" data-max="140" data-step="5">

    <script type="application/json" id="x-icue-groups">
    [
        { "title": "tr('Clock')", "properties": ["timeFormat", "showSeconds", "timeZone", "dateFormat", "clockFont"] },
        { "title": "tr('Weather')", "properties": ["city", "units", "showHourly", "animations", "demoMode"] },
        { "title": "tr('Widget Personalization')", "properties": ["background", "backgroundColor", "textColor", "textScale"] }
    ]
    </script>

    <style>
        @font-face { font-family: 'Jost'; src: url('fonts/jost-400.woff2') format('woff2'); font-weight: 400; }
        @font-face { font-family: 'Jost'; src: url('fonts/jost-600.woff2') format('woff2'); font-weight: 600; }
        @font-face { font-family: 'Outfit'; src: url('fonts/outfit-600.woff2') format('woff2'); font-weight: 600; }
        @font-face { font-family: 'Quicksand'; src: url('fonts/quicksand-600.woff2') format('woff2'); font-weight: 600; }
        @font-face { font-family: 'Space Grotesk'; src: url('fonts/space-grotesk-600.woff2') format('woff2'); font-weight: 600; }
        @font-face { font-family: 'Bebas Neue'; src: url('fonts/bebas-neue-400.woff2') format('woff2'); font-weight: 400; }
        @font-face { font-family: 'Orbitron'; src: url('fonts/orbitron-700.woff2') format('woff2'); font-weight: 700; }
        @font-face { font-family: 'Righteous'; src: url('fonts/righteous-400.woff2') format('woff2'); font-weight: 400; }
        @font-face { font-family: 'Playfair Display'; src: url('fonts/playfair-display-700.woff2') format('woff2'); font-weight: 700; }
        @font-face { font-family: 'JetBrains Mono'; src: url('fonts/jetbrains-mono-600.woff2') format('woff2'); font-weight: 600; }

        :root {
            --u: 3.3px;          /* 1% of the widget's shorter side, set by JS */
            --ts: 1;             /* text size setting */
            --cfit: 1;           /* shrinks the clock if it would not fit */
            --text: #F4F6FA;
            --clock-font: 'Jost', sans-serif; --clock-weight: 600;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        body { color: var(--text); font-family: 'Jost', 'Segoe UI', sans-serif; font-weight: 400;
            -webkit-font-smoothing: antialiased; user-select: none; }

        /* Animated sky. Canvas only, no CSS filters: those set off iCUE's redraw bug on the Edge. */
        #sky { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 16px; }

        #app { position: absolute; inset: 0; display: grid; padding: calc(var(--u) * 5) calc(var(--u) * 6);
            text-shadow: 0 1px calc(var(--u) * 2.5) rgba(0, 0, 0, 0.38); }
        .shape-wide #app { padding: calc(var(--u) * 4) calc(var(--u) * 5.5); grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
            column-gap: calc(var(--u) * 6); }
        .shape-wide #hours { grid-column: 1 / -1; }
        .shape-wide #clock { font-size: calc(var(--u) * 33 * var(--ts) * var(--cfit)); }
        .shape-wide #date { font-size: calc(var(--u) * 6.8 * var(--ts)); }
        .shape-wide #date::before { margin: calc(var(--u) * 2) 0 calc(var(--u) * 1.4); }
        .shape-wide #cond { font-size: calc(var(--u) * 6.8 * var(--ts)); margin-top: calc(var(--u) * 1.2); }
        .shape-wide #meta { font-size: calc(var(--u) * 5 * var(--ts)); margin-top: calc(var(--u) * 0.6); }
        .shape-wide #place { font-size: calc(var(--u) * 4.4 * var(--ts)); margin-top: calc(var(--u) * 0.6); }
        .shape-wide #now { padding-left: calc(var(--u) * 5); border-left: 1px solid rgba(255, 255, 255, 0.16); }
        .shape-wide #wicon { width: calc(var(--u) * 14 * var(--ts)); height: calc(var(--u) * 14 * var(--ts)); }
        .shape-wide #temp { font-size: calc(var(--u) * 21 * var(--ts)); }
        .shape-square #app, .shape-tall #app { grid-template-rows: auto auto minmax(0, 1fr) auto; justify-items: center; }

        /* ── Clock ── */
        #time-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
        #clock { display: flex; align-items: baseline; white-space: nowrap; line-height: 1; font-family: var(--clock-font);
            font-weight: var(--clock-weight); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
            font-size: calc(var(--u) * 30 * var(--ts) * var(--cfit)); }
        .shape-square #clock, .shape-tall #clock { font-size: calc(var(--u) * 21 * var(--ts) * var(--cfit)); }
        .shape-square #date, .shape-tall #date { font-size: calc(var(--u) * 6 * var(--ts)); }
        .shape-square #date::before, .shape-tall #date::before { margin: calc(var(--u) * 2) 0 calc(var(--u) * 1.5); }
        #sec { font-size: 0.42em; margin-left: 0.04em; }
        #ampm { font-size: 0.3em; margin-left: 0.18em; letter-spacing: 0.02em; }
        .no-sec #sec, .h24 #ampm { display: none; }
        #date { display: flex; flex-direction: column; align-items: center; font-size: calc(var(--u) * 7.2 * var(--ts)); opacity: 0.85; }
        #date::before { content: ''; width: calc(var(--u) * 8); height: 2px; border-radius: 2px; background: currentColor; opacity: 0.45;
            margin: calc(var(--u) * 3) 0 calc(var(--u) * 2); }
        .no-date #date { display: none; }

        /* ── Current weather ── */
        #now { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .shape-square #now, .shape-tall #now { align-items: center; }
        #now-top { display: flex; align-items: center; gap: calc(var(--u) * 3); }
        #wicon { width: calc(var(--u) * 22 * var(--ts)); height: calc(var(--u) * 22 * var(--ts)); flex: none; }
        .shape-square #wicon, .shape-tall #wicon { width: calc(var(--u) * 12 * var(--ts)); height: calc(var(--u) * 12 * var(--ts)); }
        #wicon svg, .h-ic svg { width: 100%; height: 100%; overflow: visible; }
        /* No CSS animations here: a constantly running one set off iCUE's redraw bug, turning other
           widgets' see-through backgrounds solid (XE Chat). All motion is drawn on the canvas instead. */
        #temp { font-size: calc(var(--u) * 21 * var(--ts)); font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .shape-square #temp, .shape-tall #temp { font-size: calc(var(--u) * 12 * var(--ts)); }
        .shape-square #cond, .shape-tall #cond { font-size: calc(var(--u) * 5.6 * var(--ts)); margin-top: calc(var(--u) * 1); }
        .shape-square #meta, .shape-tall #meta { font-size: calc(var(--u) * 4.6 * var(--ts)); }
        .shape-square #place, .shape-tall #place { font-size: calc(var(--u) * 4.2 * var(--ts)); }
        .shape-square #now, .shape-tall #now { margin-top: calc(var(--u) * 2.5); }
        #cond { font-size: calc(var(--u) * 7 * var(--ts)); font-weight: 600; margin-top: calc(var(--u) * 2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #meta { font-size: calc(var(--u) * 5.4 * var(--ts)); opacity: 0.85; margin-top: calc(var(--u) * 1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #place { font-size: calc(var(--u) * 5 * var(--ts)); opacity: 0.7; margin-top: calc(var(--u) * 1); display: flex; align-items: center; gap: 0.3em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        #place svg { width: 0.9em; height: 0.9em; flex: none; fill: currentColor; }
        .shape-square #cond, .shape-tall #cond, .shape-square #meta, .shape-tall #meta { text-align: center; }

        /* ── Forecast panel: pages you tap or swipe through (big touch targets for the Edge) ──
           --hs: smaller in the stacked layouts, where height is shared */
        :root { --hs: 1; }
        .shape-square, .shape-tall { --hs: 0.72; }
        #hours { position: relative; margin-top: calc(var(--u) * var(--hs) * 2.4); width: 100%; overflow: hidden; touch-action: none;
            border-radius: calc(var(--u) * var(--hs) * 5); background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.1); }
        .no-hours #hours { display: none; }
        /* no tab row: swipe or tap to change pages; tiny dots and a brief page name show where you are */
        #dots { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * var(--hs) * 1.1); display: flex; justify-content: center;
            gap: calc(var(--u) * var(--hs) * 1.2); pointer-events: none; }
        #dots i { width: calc(var(--u) * var(--hs) * 1.1); height: calc(var(--u) * var(--hs) * 1.1); border-radius: 50%; background: currentColor; opacity: 0.3; }
        #dots i.on { opacity: 0.9; }
        #pg-name { position: absolute; left: 50%; top: calc(var(--u) * var(--hs) * 1.2); transform: translateX(-50%); pointer-events: none;
            font-size: calc(var(--u) * var(--hs) * 3.6 * var(--ts)); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
            padding: 0.15em 0.8em; border-radius: 99px; background: rgba(0, 0, 0, 0.35); opacity: 0; transition: opacity 0.3s; }
        #pg-name.show { opacity: 0.9; }
        #pages { overflow: hidden; }
        #track { display: flex; transition: transform 0.45s cubic-bezier(0.22, 0.8, 0.24, 1); }
        .pg { flex: 0 0 100%; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * var(--hs) * 1.5);
            padding: calc(var(--u) * var(--hs) * 2) calc(var(--u) * var(--hs) * 2.5) calc(var(--u) * var(--hs) * 3.4); }
        /* hourly and daily cells */
        .h { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * var(--hs) * 0.9); min-width: 0; }
        .h-t { font-size: calc(var(--u) * var(--hs) * 4.8 * var(--ts)); font-weight: 600; opacity: 0.8; white-space: nowrap; }
        .h-ic { width: calc(var(--u) * var(--hs) * 8 * var(--ts)); height: calc(var(--u) * var(--hs) * 8 * var(--ts)); }
        .h-v { font-size: calc(var(--u) * var(--hs) * 6 * var(--ts)); font-weight: 600; white-space: nowrap; }
        .h-v i { font-style: normal; font-weight: 400; opacity: 0.6; margin-left: 0.35em; }
        .h-p { font-size: calc(var(--u) * var(--hs) * 4 * var(--ts)); font-weight: 600; color: #9FD3FF; min-height: 1.2em; }
        .no-pop .h-p { display: none; }   /* no rain expected: no empty row */
        .d-bar { position: relative; width: 64%; height: calc(var(--u) * var(--hs) * 1.1); border-radius: 99px; background: rgba(255, 255, 255, 0.16); }
        .d-bar b { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, #7FC4FF, #FFC46B); }
        /* details tiles */
        .tile { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * var(--hs) * 0.6); }
        .tile-l { font-size: calc(var(--u) * var(--hs) * 3.9 * var(--ts)); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; white-space: nowrap; }
        .tile-v { font-size: calc(var(--u) * var(--hs) * 7.2 * var(--ts)); font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 0.2em; }
        .tile-v svg { width: 0.75em; height: 0.75em; fill: currentColor; }
        .tile-s { font-size: calc(var(--u) * var(--hs) * 4.2 * var(--ts)); opacity: 0.8; white-space: nowrap; }
        /* moon page */
        .pg-moon { justify-content: center; gap: calc(var(--u) * var(--hs) * 7); }
        .moon-big { width: calc(var(--u) * var(--hs) * 17 * var(--ts)); height: calc(var(--u) * var(--hs) * 17 * var(--ts)); flex: none; }
        .moon-big svg { width: 100%; height: 100%; }
        .moon-name { font-size: calc(var(--u) * var(--hs) * 6.8 * var(--ts)); font-weight: 600; }
        .moon-sub { font-size: calc(var(--u) * var(--hs) * 4.6 * var(--ts)); opacity: 0.8; margin-top: calc(var(--u) * var(--hs) * 0.8); }

        #demo-tag { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 2.4); display: none; padding: 0.2em 0.7em; border-radius: 99px;
            background: rgba(0, 0, 0, 0.4); font-size: calc(var(--u) * 3.6); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
        .demo #demo-tag { display: block; }
        #status { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 3); text-align: center; font-size: calc(var(--u) * 4.4); opacity: 0.7; }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>
    <div id="app">
        <div id="time-wrap">
            <div id="clock"><span id="hm">--:--</span><span id="sec"></span><span id="ampm"></span></div>
            <div id="date"></div>
        </div>
        <div id="now">
            <div id="now-top"><div id="wicon"></div><div id="temp"></div></div>
            <div id="cond"></div>
            <div id="meta"></div>
            <div id="place"></div>
        </div>
        <div id="hours">
            <div id="pages"><div id="track">
                <div class="pg" id="pg-hourly"></div><div class="pg" id="pg-days"></div><div class="pg" id="pg-details"></div><div class="pg pg-moon" id="pg-moon"></div>
            </div></div>
            <div id="dots"><i class="on"></i><i></i><i></i><i></i></div>
            <div id="pg-name"></div>
        </div>
    </div>
    <div id="status"></div>
    <div id="demo-tag"></div>

    <script>
    // iCUE declares `icueEvents` itself: assign it, never re-declare it (that's a SyntaxError).
    icueEvents = { onICUEInitialized: function () { WX.init(); }, onDataUpdated: function () { WX.apply(); } };

    var WX = (function () {
        'use strict';
        var $ = function (id) { return document.getElementById(id); };
        var body = document.body, root = document.documentElement;

        // ── Settings ──────────────────────────────────────────────
        var S = {
            timeFormat: '12h', showSeconds: true, timeZone: '', dateFormat: 'MonDDYYYY', clockFont: 'jost',
            city: '', units: 'auto', showHourly: true, animations: true, demoMode: 'off',
            background: 'scene', backgroundColor: '#0B0F1A', textColor: '#F4F6FA', textScale: 100
        };
        var FONTS = {
            jost: ['Jost', 600], outfit: ['Outfit', 600], quicksand: ['Quicksand', 600], grotesk: ['Space Grotesk', 600],
            bebas: ['Bebas Neue', 400], orbitron: ['Orbitron', 700], righteous: ['Righteous', 400],
            playfair: ['Playfair Display', 700], mono: ['JetBrains Mono', 600]
        };
        function bool(v) { return v === true || v === 'true' || v === 1; }
        function oneOf(v, list, d) { return list.indexOf(v) >= 0 ? v : d; }
        function color(v, d) { return typeof v === 'string' && /^#[0-9a-f]{3,8}$/i.test(v.trim()) ? v.trim() : d; }
        function readSettings() {
            // iCUE exposes each property as a global of the same name.
            if (typeof timeFormat !== 'undefined') S.timeFormat = timeFormat === '24h' || timeFormat === true ? '24h' : '12h';
            if (typeof showSeconds !== 'undefined') S.showSeconds = bool(showSeconds);
            if (typeof timeZone !== 'undefined') S.timeZone = String(timeZone || '').split(' ')[0];
            if (typeof dateFormat !== 'undefined') S.dateFormat = oneOf(dateFormat, ['MonDDYYYY', 'DayMonDD', 'Long', 'MMDDYYYY', 'DDMMYYYY', 'None'], 'MonDDYYYY');
            if (typeof clockFont !== 'undefined') S.clockFont = FONTS[clockFont] ? clockFont : 'jost';
            // not called `location`: iCUE makes each setting a global, and that name is the page's address
            if (typeof city !== 'undefined') S.city = String(city || '').trim();
            if (typeof units !== 'undefined') S.units = oneOf(units, ['auto', 'F', 'C'], 'auto');
            if (typeof showHourly !== 'undefined') S.showHourly = bool(showHourly);
            if (typeof animations !== 'undefined') S.animations = bool(animations);
            if (typeof demoMode !== 'undefined') S.demoMode = oneOf(demoMode, ['off', 'fast', 'slow'], 'off');
            if (typeof background !== 'undefined') S.background = oneOf(background, ['scene', 'transparent', 'solid'], 'scene');
            if (typeof backgroundColor !== 'undefined') S.backgroundColor = color(backgroundColor, '#0B0F1A');
            if (typeof textColor !== 'undefined') S.textColor = color(textColor, '#F4F6FA');
            if (typeof textScale !== 'undefined') S.textScale = Math.max(70, Math.min(140, Number(textScale) || 100));
        }
        function lang() { return typeof languageCode !== 'undefined' && languageCode ? languageCode : (navigator.language || 'en-US'); }

        // ── Clock ─────────────────────────────────────────────────
        var shownHM = '', shownDate = '';
        function fmt(opts, d) {
            try { return new Intl.DateTimeFormat(lang(), Object.assign({ timeZone: S.timeZone || undefined }, opts)).format(d); }
            catch (e) { return new Intl.DateTimeFormat('en-US', opts).format(d); }   // unknown time zone name
        }
        function partsOf(d) {
            var p = {};
            try { new Intl.DateTimeFormat('en-US', { timeZone: S.timeZone || undefined, hour: 'numeric', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
                .formatToParts(d).forEach(function (x) { p[x.type] = x.value; }); }
            catch (e) { p = { hour: d.getHours(), minute: ('0' + d.getMinutes()).slice(-2), second: ('0' + d.getSeconds()).slice(-2) }; }
            return p;
        }
        function tick() {
            var now = new Date(), p = partsOf(now), h = +p.hour % 24, hm;
            if (S.timeFormat === '24h') hm = ('0' + h).slice(-2) + ':' + p.minute;
            else hm = ((h % 12) || 12) + ':' + p.minute;
            if (hm !== shownHM) { shownHM = hm; $('hm').textContent = hm; $('ampm').textContent = h < 12 ? 'AM' : 'PM'; fitClock(); }
            if (S.showSeconds) $('sec').textContent = ':' + p.second;
            var dt = '';
            if (S.dateFormat === 'MonDDYYYY') dt = fmt({ month: 'short', day: 'numeric', year: 'numeric' }, now);
            else if (S.dateFormat === 'DayMonDD') dt = fmt({ weekday: 'short', month: 'short', day: 'numeric' }, now);
            else if (S.dateFormat === 'Long') dt = fmt({ weekday: 'long', month: 'long', day: 'numeric' }, now);
            else if (S.dateFormat === 'MMDDYYYY') dt = fmt({ month: '2-digit', day: '2-digit', year: 'numeric' }, now);
            else if (S.dateFormat === 'DDMMYYYY') dt = new Intl.DateTimeFormat('en-GB', { timeZone: S.timeZone || undefined, day: '2-digit', month: '2-digit', year: 'numeric' }).format(now);
            if (dt !== shownDate) { shownDate = dt; $('date').textContent = dt; }
            setTimeout(tick, 1000 - (Date.now() % 1000) + 5);   // land just after each new second
        }
        function fitClock() {   // shrink the clock if the font is wide; no ResizeObserver (iCUE redraw bug)

                        by += rnd(Hh * 0.05, Hh * 0.11); bx += rnd(-W * 0.035, W * 0.035); bolt[0].push([bx, by]);
                        if (Math.random() < 0.18) { var fx = bx, fy = by, br = [[fx, fy]]; for (var j = 0; j < 3; j++) { fx += rnd(-W * 0.04, W * 0.04); fy += rnd(Hh * 0.04, Hh * 0.08); br.push([fx, fy]); } bolt.push(br); }
                    }
                }
                if (flash > 0) {
                    ctx.fillStyle = 'rgba(214,224,255,' + (flash * 0.28) + ')'; ctx.fillRect(0, 0, W, Hh);
                    if (flash > 0.5 && bolt) {
                        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                        bolt.forEach(function (path, bi) {
                            [[7, 0.18], [2.4, 1]].forEach(function (st) {   // a wide faint glow, then the bright core
                                ctx.strokeStyle = 'rgba(235,240,255,' + flash * st[1] * (bi ? 0.6 : 1) + ')'; ctx.lineWidth = st[0] * dpr * (bi ? 0.6 : 1);
                                ctx.beginPath(); path.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke();
                            });
                        });
                    }
                    if (!boltHold()) flash = Math.max(0, flash - dt * 3);
                    if (flash === 0 && flashes > 0) { flashes--; flash = 0.75; }   // the quick second flicker
                }
            }

            // a soft darker band along the bottom keeps the hourly strip readable
            if (S.background === 'scene') {
                var vg = ctx.createLinearGradient(0, Hh * 0.55, 0, Hh); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.18)');
                ctx.fillStyle = vg; ctx.fillRect(0, Hh * 0.55, W, Hh * 0.45);
            }
        }
        function frame(now) {
            raf = 0;
            if (document.hidden || !S.animations) return;
            var dt = Math.min(0.1, (now - (last || now)) / 1000);
            if (now - last < 1000 / 30 - 2) { raf = requestAnimationFrame(frame); return; }   // ~30 fps is plenty
            last = now;
            draw(dt);
            raf = requestAnimationFrame(frame);
        }
        function wake() { if (!raf && S.animations && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } }

        // ── Demo: cycle through every weather type at sunrise, midday, sunset and night ──
        var demo = null, demoTimer = 0, demoI = 0, demoFor = 'off';
        var DEMO_WX = [[0, 'Clear'], [2, 'Partly cloudy'], [3, 'Cloudy'], [45, 'Fog'], [53, 'Drizzle'], [63, 'Rain'], [73, 'Snow'], [95, 'Thunderstorm']];
        var DEMO_TOD = [['dawn', 'Sunrise'], ['noon', 'Midday'], ['dusk', 'Sunset'], ['night', 'Night']];
        function demoStep() {
            var w = DEMO_WX[demoI % DEMO_WX.length], d = DEMO_TOD[Math.floor(demoI / DEMO_WX.length) % DEMO_TOD.length];
            demo = { code: w[0], tod: d[0] }; demoI++;
            $('demo-tag').textContent = 'Demo · ' + w[1] + ' · ' + d[1];
            tod = skyTime(); todAt = t;
            if (data) render(); else { setScene(w[0], d[0] !== 'night', 10, 270); }
            recolour();
        }
        function demoSync() {
            if (S.demoMode === demoFor) return;
            demoFor = S.demoMode; clearInterval(demoTimer);
            body.classList.toggle('demo', S.demoMode !== 'off');
            if (S.demoMode === 'off') { demo = null; tod = skyTime(); if (data) render(); recolour(); return; }
            demoI = 0; demoStep();
            demoTimer = setInterval(demoStep, S.demoMode === 'fast' ? 6000 : 15000);
        }

        // ── Apply / start ─────────────────────────────────────────
        var lastWeatherKey = null;
        function apply() {
            readSettings();
            root.style.setProperty('--text', S.textColor);
            var fnt = FONTS[S.clockFont];
            root.style.setProperty('--clock-font', "'" + fnt[0] + "', 'Jost', sans-serif"); root.style.setProperty('--clock-weight', fnt[1]);
            body.classList.toggle('h24', S.timeFormat === '24h');
            body.classList.toggle('no-sec', !S.showSeconds);
            body.classList.toggle('no-date', S.dateFormat === 'None');
            body.classList.toggle('no-anim', !S.animations);
            if (!S.showSeconds) $('sec').textContent = '';
            shownHM = ''; shownDate = '';
            layout();
            var wk = S.city + '|' + S.units;
            if (wk !== lastWeatherKey) { lastWeatherKey = wk; data = null; loadCache(); refresh(); }
            else render();
            tod = skyTime(); build(); draw(0); wake();
            demoSync();
            setTimeout(function () { fitClock(); zone = null; }, 1500);   // after the chosen font has loaded
        }
        var started = false, started0 = typeof iCUE_initialized !== 'undefined';   // inside iCUE: no preview overrides
        function init() {
            if (started) { apply(); return; }
            started = true;
            apply();
            tick();
            window.addEventListener('resize', layout);
            var pp = !started0 && /[?&]page=(\d)/.exec(window.location.search);   // browser preview only: open a panel page
            if (pp) { $('track').style.transition = 'none'; goPage(+pp[1]); }
            document.addEventListener('visibilitychange', function () { if (!document.hidden) { wake(); if (data) render(); } });
        }
        return { init: init, apply: apply };
    })();

    if (typeof iCUE_initialized !== 'undefined') { if (iCUE_initialized) WX.init(); }
    else WX.init();   // opened outside iCUE (browser preview)
    </script>
</body>
</html>
